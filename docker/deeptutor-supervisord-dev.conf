[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:backend]
command=python -c "import os; import scripts.extractor_platform_hook; import uvicorn; uvicorn.run('deeptutor.api.main:app', host='0.0.0.0', port=int(os.environ.get('BACKEND_PORT', '8001')), reload=True)"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app:/tutor_platform",PYTHONUNBUFFERED="1"

[program:frontend]
command=/bin/bash -c "cd /app/web && HOSTNAME=0.0.0.0 PORT=3783 node server.js"
directory=/app/web
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="3783",NEXT_PUBLIC_API_BASE="http://localhost:3782"

[program:proxy]
command=/usr/local/bin/node /app/scripts/frontend-proxy.mjs
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=NODE_ENV="development",PLATFORM_HOST="platform",PLATFORM_PORT="8100",PROXY_FRONTEND_PORT="3783",PROXY_PORT="3782"
