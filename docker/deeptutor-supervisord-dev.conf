[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:backend]
command=python -c "import os; import scripts.extractor_platform_hook; import uvicorn; uvicorn.run('deeptutor.api.main:app', host='0.0.0.0', port=int(os.environ.get('BACKEND_PORT', '8001')), reload=True)"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app:/tutor_platform",PYTHONUNBUFFERED="1"

[program:frontend]
; Start Next.js in development mode with Turbopack hot-reload.
; The source directories (web/app, web/components, web/lib, etc.) are
; volume-mounted from the host, so any file change triggers instant HMR.
; We clean the stale .next2 directory baked in by the production build
; so Turbopack starts from a clean slate.
command=/bin/bash -c "rm -rf /app/web/.next2 && cd /app/web && node node_modules/next/dist/bin/next dev --turbo -H 0.0.0.0 -p ${PORT:-3783}"
directory=/app/web
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=NODE_ENV="development",PORT="3783"

; Built-in guard: if next dev crashes and autorestart loops, supervisord
; gives up after 3 failures in 30s to avoid infinite restart storms.
startretries=3

[program:proxy]
command=/usr/local/bin/node /app/scripts/frontend-proxy.mjs
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=NODE_ENV="development",PLATFORM_HOST="platform",PLATFORM_PORT="8100",PROXY_FRONTEND_PORT="3783",PROXY_PORT="3782"
