# ============================================
# DeepTutor Development Override
# ============================================
# Usage:
#   python scripts/docker_compose.py -f docker-compose.yml -f docker-compose.dev.yml up -d
#   python scripts/docker_compose.py -f docker-compose.yml -f docker-compose.dev.yml build
#
# For LLM services (ollama / rkllama) and WeChat gateway (hermes_agent):
#   docker compose -f docker-compose.dev.yml up -d ollama hermes_agent
# ============================================

services:
  deeptutor:
    build:
      target: development
      args:
        - HTTP_PROXY=
        - HTTPS_PROXY=
    volumes:
      # Mount source code for hot-reload
      - ./vendor/deeptutor/deeptutor:/app/deeptutor:ro
      - ./vendor/deeptutor/deeptutor_cli:/app/deeptutor_cli:ro
      - ./scripts:/app/scripts:ro
      - ./tutor_platform:/tutor_platform:ro
      - ./domains:/domains:ro
      - ./config:/app/config:ro
      # Frontend dev mode: mount source for hot-reload
      - ./web/app:/app/web/app:ro
      - ./web/components:/app/web/components:ro
      - ./web/context:/app/web/context:ro
      - ./web/features:/app/web/features:ro
      - ./web/hooks:/app/web/hooks:ro
      - ./web/i18n:/app/web/i18n:ro
      - ./web/lib:/app/web/lib:ro
      - ./web/locales:/app/web/locales:ro
      - ./web/public:/app/web/public:ro
      # CSS/Tailwind config — required for Turbopack to compile properly
      - ./web/postcss.config.js:/app/web/postcss.config.js:ro
      - ./web/tailwind.config.js:/app/web/tailwind.config.js:ro
      - ./web/app/globals.css:/app/web/app/globals.css:ro
      - ./web/app/fonts.css:/app/web/app/fonts.css:ro
      - ./web/tsconfig.json:/app/web/tsconfig.json
      - ./web/next.config.js:/app/web/next.config.js:ro
      # Data persistence
      - ./data/user:/app/data/user
      - ./data/memory:/app/data/memory
      - ./data/knowledge_bases:/app/data/knowledge_bases
    environment:
      - DEEPTUTOR_ENV=development
      - BACKEND_RELOAD=true
    networks:
      - deeptutor-network

  platform:
    build:
      context: .
      dockerfile: docker/platform/Dockerfile
      args:
        - HTTP_PROXY=
        - HTTPS_PROXY=
    volumes:
      - ./tutor_platform:/tutor_platform:ro
      - ./domains:/domains:ro
      - ./config:/app/config:ro
      - ./vendor/hermes-agent:/vendor/hermes-agent:ro
      - ./docker/platform/provider_api.py:/app/provider_api.py:ro
      - ./docker/platform/mcp_server.py:/app/mcp_server.py:ro
      - ./docker/platform/device_manager_api.py:/app/device_manager_api.py:ro
      # Data persistence
      - ./data/mastery:/data/mastery
      - ./data/chromadb:/data/chromadb
      - ./data/ingest_status:/data/ingest_status
      - ./data/uploads:/data/uploads
      - ./data/sources:/data/sources
      - ./data/hermes:/data/hermes
      - ./data/quiz_sessions:/data/quiz_sessions
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DEEPTUTOR_ENV=development
      - PROVIDER_API_PORT=8100
      - DEVICE_MANAGER_PORT=8101
      - DEEPTUTOR_API_URL=http://deeptutor:8001
      - RKLLM_STUB_MODE=true
      - PYTHONPATH=/vendor/hermes-agent:/tutor_platform:/
    networks:
      - deeptutor-network
    depends_on:
      deeptutor:
        condition: service_started

networks:
  deeptutor-network:
    driver: bridge
