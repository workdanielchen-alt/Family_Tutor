# ============================================
# DeepTutor Production Override — OCR + Local LLM
# ============================================
# Qwen2-VL OCR via llama-mtmd-cli subprocess.
# Embedding via BgeSmallEmbedding (in-process, no external service).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================

services:

  # ============================================
  # Hermes Agent — WeChat iLink dual-bot gateway
  # ============================================
  hermes_agent:
    image: deepseek-hermes_agent:latest
    container_name: hermes_agent
    restart: unless-stopped
    ports:
      - "8004:8004"
    # Bypass s6-overlay (CRLF issue in type files) — run gateway directly
    entrypoint: ["/bin/bash", "/opt/hermes/docker/gateway_start.sh"]
    command: []
    environment:
      - WEIXIN_TOKEN=${WEIXIN_TOKEN}
      - WEIXIN_ACCOUNT_ID=${WEIXIN_ACCOUNT_ID}
      - CHILD_WEIXIN_TOKEN=${CHILD_WEIXIN_TOKEN}
      - CHILD_WEIXIN_ACCOUNT_ID=${CHILD_WEIXIN_ACCOUNT_ID}
      - WEIXIN_HOME_CHANNEL=o9cq802ba7xQQlXcT8l93_xO0jN0@im.wechat
      - WEIXIN_DM_POLICY=open
      - WEIXIN_GROUP_POLICY=disabled
      - WEIXIN_ALLOWED_USERS=
      - GATEWAY_ALLOW_ALL_USERS=true
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8004
      - API_SERVER_KEY=deepseek-local-key
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${DEEPSEEK_API_KEY}
      - HERMES_AGENT_TIMEOUT=120
      - HERMES_API_TIMEOUT=30
      - HERMES_OPENAI_TIMEOUT=90
      - HERMES_HOME=/opt/data
      - PLATFORM_API_URL=http://platform:8100
      - HERMES_ALLOW_ROOT_GATEWAY=1
    volumes:
      - ./data_dev/hermes:/opt/data:rw
      - ./data_dev/hermes_child:/opt/data/child:rw
      - ./data/hermes:/data/hermes
      - ./config/hermes_config.yaml:/opt/data/config.yaml:ro
      - ./config/hermes_child_config.yaml:/opt/data/child/config.yaml:ro
      - ./vendor/hermes-agent/run_agent.py:/opt/hermes/run_agent.py:ro
      - ./vendor/hermes-agent/gateway/platforms/weixin.py:/opt/hermes/gateway/platforms/weixin.py:ro
      - ./vendor/hermes-agent/gateway/platforms/base.py:/opt/hermes/gateway/platforms/base.py:ro
      - ./vendor/hermes-agent/gateway/config.py:/opt/hermes/gateway/config.py:ro
      - ./vendor/hermes-agent/gateway/delivery.py:/opt/hermes/gateway/delivery.py:ro
      - ./vendor/hermes-agent/gateway/run.py:/opt/hermes/gateway/run.py:ro
      - ./vendor/hermes-agent/gateway/session.py:/opt/hermes/gateway/session.py:ro
      - ./vendor/hermes-agent/gateway/session_context.py:/opt/hermes/gateway/session_context.py:ro
      - ./vendor/hermes-agent/gateway/status.py:/opt/hermes/gateway/status.py:ro
      - ./docker/platform/gateway_start.sh:/opt/hermes/docker/gateway_start.sh:ro
    networks:
      - deeptutor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # rkllama — 本地 NPU LLM 推理服务 (PC 开发: STUB 模式)
  # ============================================
  rkllama:
    build:
      context: ./docker/rkllama
      dockerfile: Dockerfile
    image: deepseek-rkllama:latest
    container_name: rkllama
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RKLLM_PORT=8080
      - RKLLM_STUB_MODE=true
      - TZ=Asia/Shanghai
    volumes:
      - ./data/rkllama:/app/data
    networks:
      - deeptutor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Qwen2-VL-2B — OCR via llama.cpp (替代 MiniCPM-V)
  # ============================================
  qwen2vl:
    image: python:3.11-slim
    container_name: qwen2vl
    restart: unless-stopped
    mem_limit: 6G
    ports:
      - "8082:8081"
    volumes:
      - ./data/qwen2-vl-gguf:/models:ro
      - ./data/llamacpp/llama-b9553:/server:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apt-get update -qq && apt-get install -y -qq libgomp1 2>/dev/null || true
        export LD_LIBRARY_PATH=/server
        /server/llama-server \
          --host 0.0.0.0 --port 8081 \
          -m /models/Qwen2-VL-2B-Instruct-Q4_K_M.gguf \
          --mmproj /models/mmproj-Qwen2-VL-2B-Instruct-Q8_0.gguf \
          -t 12 \
          -c 4096 \
          -b 512 \
          -ub 128 \
          -np 1 \
          --mlock \
          --no-mmap \
          --cache-type-k q8_0 \
          --cache-type-v q8_0 \
          --flash-attn on \
          --image-min-tokens 1024 \
          -fit off
    networks:
      - deeptutor-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================
  # Platform — enable OCR via qwen2vl
  # ============================================
  platform:
    mem_limit: 8g
    environment:
      - OCR_URL=http://qwen2vl:8081
      - OCR_PROVIDER=qwen2vl
      - TZ=Asia/Shanghai
      - HERMES_CONTAINER=hermes_agent
      - HERMES_AGENT_URL=http://hermes_agent:8004
      - RKLLM_SERVER_URL=http://rkllama:8080
      - RKLLM_STUB_MODE=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/platform/provider_api.py:/app/provider_api.py:ro
      - ./docker/platform/ocr_runner.py:/app/ocr_runner.py:ro
      - ./docker/platform/mcp_server.py:/app/mcp_server.py:ro
      # llama.cpp 工具链 + Qwen2-VL 模型 (OCR 子进程)
      - ./data/llamacpp/llama-b9553:/llamacpp:ro
      - ./data/qwen2-vl-gguf:/models:ro
      # 教学引擎 YAML 提示词 — 修改后无需重启，TeachPromptManager 自动热重载
      - ./config/teach-prompts.yaml:/app/config/teach-prompts.yaml:ro
      # 教学引擎代码 — 热重载逻辑 live 同步 (含 max_pixels 优化)
      - ./tutor_platform:/tutor_platform:ro
    networks:
      - deeptutor-network
    depends_on:
      hermes_agent:
        condition: service_started
      qwen2vl:
        condition: service_started
